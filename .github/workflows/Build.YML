# Simpan sebagai .github/workflows/build.yml di repo builds (branch main)
name: build-app
on:
  workflow_dispatch:
    inputs:
      id:
        required: true
      entry:
        required: true
      target:
        required: true
        default: exe

permissions:
  contents: write

jobs:
  exe:
    if: inputs.target == 'exe'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ekstrak kode
        shell: pwsh
        run: Expand-Archive -Path "jobs/${{ inputs.id }}/src.zip" -DestinationPath src
      - name: Install dependensi
        shell: pwsh
        run: |
          pip install pyinstaller customtkinter
          if (Test-Path src/requirements.txt) { pip install -r src/requirements.txt }
      - name: Build exe (satu file, console tetap muncul)
        shell: pwsh
        working-directory: src
        run: pyinstaller --onefile --collect-all customtkinter --name app "${{ inputs.entry }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: job-${{ inputs.id }}
          name: job-${{ inputs.id }}
          files: src/dist/app.exe
      - name: Tandai gagal
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "fail-${{ inputs.id }}" --title failed --notes "Build exe gagal. Periksa kode atau requirements.txt." --repo "${{ github.repository }}"

  apk:
    if: inputs.target == 'apk'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ID: ${{ inputs.id }}
      ENTRY: ${{ inputs.entry }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak kode dan cek Tkinter
        run: |
          unzip -q "jobs/$ID/src.zip" -d src
          if grep -rEiq "^\s*(import|from)\s+(tkinter|customtkinter)" src --include=*.py; then
            gh release create "fail-$ID" --title failed --repo "$GITHUB_REPOSITORY" \
              --notes "Kode memakai Tkinter/CustomTkinter, tidak bisa dijadikan Apk. Ubah ke Kivy dulu."
            exit 1
          fi
      - name: Siapkan buildozer.spec
        working-directory: src
        run: |
          [ "$ENTRY" != "main.py" ] && cp "$ENTRY" main.py || true
          REQ="python3,kivy"
          if [ -f requirements.txt ]; then
            EXTRA=$(grep -vE '^\s*(#|$)' requirements.txt | sed 's/[=<>~ ].*//' | paste -sd, -)
            [ -n "$EXTRA" ] && REQ="$REQ,$EXTRA"
          fi
          cat > buildozer.spec <<SPEC
          [app]
          title = PyApp
          package.name = pyapp$ID
          package.domain = org.pyapp
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,txt,ttf
          version = 0.1
          requirements = $REQ
          orientation = portrait
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          [buildozer]
          log_level = 2
          SPEC
          sed -i 's/^ *//' buildozer.spec
      - name: Build Apk
        id: bz
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          workdir: src
          buildozer_version: stable
      - name: Ganti nama
        run: cp "${{ steps.bz.outputs.filename }}" app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: job-${{ inputs.id }}
          name: job-${{ inputs.id }}
          files: app.apk
      - name: Tandai gagal
        if: failure()
        run: gh release view "fail-$ID" >/dev/null 2>&1 || gh release create "fail-$ID" --title failed --repo "$GITHUB_REPOSITORY" --notes "Build Apk gagal. Pastikan kode memakai Kivy dan file utamanya benar."
